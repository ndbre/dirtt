<text x="40" y="48" font-size="26" font-weight="bold" text-anchor="start" fill="#5D1725">D.I.R.T.T. drivetrain motor test: wiring</text>
<text x="40" y="76" font-size="15" font-weight="normal" text-anchor="start" fill="#555">Arduino sends R/C pulses on D9/D10 → Cytron MDDRC10 (mode switch on MIX) → 2 motors per side in parallel</text>
