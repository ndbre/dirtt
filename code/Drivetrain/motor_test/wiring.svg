<text x="944" y="465" font-size="16" font-weight="bold" fill="#d62828">×</text>
<line x1="910" y1="348" x2="940" y2="348" stroke="#8a8f94" stroke-width="2" stroke-dasharray="4 4"/>
<text x="944" y="353" font-size="16" font-weight="bold" fill="#d62828">×</text>
<text x="950" y="585" font-size="12.5" font-weight="bold" text-anchor="start" fill="#d62828">+5V pins: not connected</text>
<text x="950" y="602" font-size="12.5" font-weight="normal" text-anchor="start" fill="#555">(Arduino runs off USB)</text>
<rect x="40" y="820" width="1420" height="140" rx="6" fill="#f7f7f5" stroke="#C1C6C8" stroke-width="1.5"/>
<text x="60" y="850" font-size="16" font-weight="bold" text-anchor="start" fill="#5D1725">Power-up order</text>
<text x="60" y="878" font-size="14" font-weight="normal" text-anchor="start" fill="#1f2328">1. Rover on blocks, wheels off the ground. Driver switch on MIX. Power switch OFF.</text>
<text x="60" y="900" font-size="14" font-weight="normal" text-anchor="start" fill="#1f2328">2. Plug the Arduino into the laptop, upload motor_test.ino, open Serial Monitor (115200, "Newline").</text>
<text x="60" y="922" font-size="14" font-weight="normal" text-anchor="start" fill="#1f2328">3. Switch on the 12 V. The driver takes the Arduino's 1500 µs "stop" pulse as its neutral point at power-up,</text>
<text x="60" y="944" font-size="14" font-weight="normal" text-anchor="start" fill="#1f2328">    so the Arduino must already be running. Then type  test  (or w / s / a / d, x to stop).</text>
<text x="1440" y="948" font-size="12.5" font-weight="normal" text-anchor="end" fill="#555">Wire gauge: 16 AWG for battery and motor leads, any jumper wire for signals.</text>
