<text x="150" y="770" font-size="12.5" font-weight="normal" text-anchor="start" fill="#555">Motor leads: the 2 thick wires (usually red +, black −). Both motors on a side are wired the same.</text>
<text x="150" y="788" font-size="12.5" font-weight="normal" text-anchor="start" fill="#555">Encoder wires (the 4 thin ones) aren't used for this test: tape them off. Side runs backwards? Swap its pair at the driver.</text>
